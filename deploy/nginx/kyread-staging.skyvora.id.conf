# kyread staging (Laravel): kyread-staging.skyvora.id. Certbot adds the HTTPS parts.
# Code: /var/www/kyread-staging/current (public/ is the web root), PHP-FPM 8.5.
server {
    listen 80;
    listen [::]:80;
    server_name kyread-staging.skyvora.id;

    root /var/www/kyread-staging/current/public;
    index index.php;

    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;

    # Staging: jangan diindeks mesin pencari.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/kyread-staging.skyvora.id.access.log;
    error_log  /var/log/nginx/kyread-staging.skyvora.id.error.log;
}
